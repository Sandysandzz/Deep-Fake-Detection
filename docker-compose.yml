# ============================================
# Deepfake Detection System - Docker Compose
# ============================================
# Orchestrates backend (Flask) and frontend (React + nginx) services

version: "3.8"

services:
  # ── Backend Service (Flask API) ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepfake-backend
    ports:
      - "5000:5000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    environment:
      - MODEL_PATH=/app/models/best_model.h5
      - FLASK_DEBUG=false
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # ── Frontend Service (React + nginx) ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: deepfake-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# ── Named Volumes ──
volumes:
  model-data:
  raw-data:
